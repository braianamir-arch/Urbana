<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16201c">

<title>URBANA — City Builder v0.33</title>
<style>
:root{--glass:rgba(17,25,22,.84);--line:rgba(255,255,255,.09);--acc:#f2c84b;--ok:#7fd88f;--bad:#ff7a6b;--txt:#f3f6f4;--sb:max(10px,env(safe-area-inset-bottom));--st:max(10px,env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfe3d6;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(8,20,16,.22))}
#hud{position:fixed;inset:0;pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:absolute;top:var(--st);left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.left{display:flex;flex-direction:column;gap:8px}
.stats{pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:10px 12px;min-width:176px;cursor:pointer}
.money{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.money b{font-size:20px;font-weight:800;letter-spacing:-.01em;transition:color .3s}.money b.neg{color:var(--bad)}
.rate{font-size:12px;font-weight:700}.rate.up{color:var(--ok)}.rate.down{color:var(--bad)}
.row{display:flex;gap:11px;font-size:13px;font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap}
.row span{display:flex;align-items:center;gap:4px}.row svg.i{width:15px;height:15px;opacity:.75}
.dem{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800}
.dem span{display:flex;align-items:center;gap:4px}
.dem i{display:block;width:28px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.dem i b{display:block;height:100%;width:50%;border-radius:3px;transition:width .6s}
#dR b{background:#7fd88f}#dC b{background:#6fb7ff}#dI b{background:#f2c84b}
.clock{font-size:11px;opacity:.7;font-weight:650;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.clock svg.i{width:13px;height:13px}
.obj{pointer-events:auto;padding:9px 12px;font-size:12px;width:220px;display:none;cursor:pointer}
.obj.show{display:block}.obj small{opacity:.6;font-weight:700;letter-spacing:.04em;font-size:10px}
.obj b{display:block;font-size:13px;margin:2px 0 6px}
.pg{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}.pg i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .4s}
.obj .rw{display:flex;justify-content:space-between;margin-top:5px;opacity:.75;font-variant-numeric:tabular-nums}
.ctrl{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:150px}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;color:var(--txt);padding:0;cursor:pointer;transition:transform .1s,opacity .2s}
.ib:active{transform:scale(.92)}.ib[disabled]{opacity:.35}.ib.on{color:var(--acc)}
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:4px;padding:6px;pointer-events:auto;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{position:relative;border:0;background:transparent;color:#dbe4de;border-radius:12px;padding:7px 8px 6px;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-size:11px;font-weight:650;cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s,transform .1s}
.tool small{font-size:10px;opacity:.6;font-weight:600;font-variant-numeric:tabular-nums;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool.active{background:var(--acc);color:#1b211d}.tool.active small{opacity:.75}
.tool:active{transform:scale(.94)}
.tool .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);display:none}
.tool .dot.on{display:block}
.sub{position:absolute;left:50%;bottom:calc(var(--sb) + 76px);transform:translate(-50%,8px);display:flex;gap:4px;padding:6px;pointer-events:none;opacity:0;transition:opacity .16s,transform .16s;max-width:calc(100% - 20px);overflow-x:auto}
.sub.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sub .tool{min-width:70px}
.sub .tool.lock{opacity:.42}
.zb{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#17201b}
.toast{position:absolute;left:50%;top:calc(var(--st) + 150px);transform:translate(-50%,-6px);padding:9px 14px;font-size:13px;font-weight:600;opacity:0;transition:opacity .22s,transform .22s;max-width:calc(100% - 24px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast.link{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.info{position:absolute;left:50%;bottom:calc(var(--sb) + 76px);transform:translate(-50%,10px);width:min(350px,calc(100% - 20px));max-height:calc(100% - var(--st) - 200px);overflow:auto;padding:12px 14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.info.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.info h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.info h3 em{font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:8px;margin-left:6px}
.x{background:transparent;border:0;color:var(--txt);opacity:.6;padding:4px;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.kv .m{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:-1px 0 3px}
.kv .m b{display:block;height:100%;border-radius:3px}
.why{margin-top:8px;font-size:12px;line-height:1.35;opacity:.9}
.why div{display:flex;gap:6px}.why .b{color:var(--bad)}.why .g{color:var(--ok)}
.btnrow{display:flex;gap:6px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:9px;font-family:inherit;font-weight:700;font-size:13px;background:rgba(255,255,255,.1);color:var(--txt);cursor:pointer}
.btn.danger{background:rgba(255,122,107,.18);color:#ffb3a9}
.sheet{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(var(--st) + 100px);padding:6px;display:none;flex-direction:column;min-width:220px;pointer-events:auto}
.sheet.show{display:flex}
.sheet button{text-align:left;background:transparent;border:0;color:inherit;padding:11px 12px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.sheet button:hover,.sheet button.on{background:rgba(255,255,255,.08)}
.sheet button span{opacity:.6}
.sheet hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.ver{font-size:10px;opacity:.45;padding:6px 12px 4px}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:calc(var(--sb) + 80px);padding:8px 12px;font-size:12px;font-weight:700;display:none;flex-direction:column;gap:5px;pointer-events:auto;cursor:pointer}
.legend.show{display:flex}.legend i{display:block;width:140px;height:8px;border-radius:4px}
.legend div{display:flex;justify-content:space-between;font-weight:600;opacity:.7;font-size:10px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(370px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;padding:14px 16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.tax{display:grid;grid-template-columns:80px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.tax input{width:100%;accent-color:var(--acc)}
.tax b{text-align:right;font-variant-numeric:tabular-nums}
.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.ledger .h{grid-column:1/-1;font-size:11px;font-weight:800;opacity:.55;letter-spacing:.05em;margin-top:6px}
.ledger .t{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
.note{font-size:11px;opacity:.6;margin-top:10px;line-height:1.35}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;width:90%}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner small{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--acc);text-shadow:0 2px 10px rgba(0,0,0,.4)}
.banner h2{margin:4px 0;font-size:34px;font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45);letter-spacing:-.02em}
.banner p{margin:0;font-size:14px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.stg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.stg i{flex:1;display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;min-width:40px}.stg i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2c84b,#ffde85);border-radius:3px;transition:width .6s}
.stg #stgP{opacity:.6;font-weight:700}
.stage{border-top:1px solid var(--line);padding:9px 0 8px}.stage:first-of-type{border-top:0}
.stage h4{margin:0 0 5px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.stage h4 span{opacity:.6;font-weight:700;font-size:11px}
.stage.cur h4{color:var(--acc)}.stage.lock{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips span{font-size:11px;font-weight:650;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08)}
.paper{background:#f3ecdc;color:#2a2620;border-radius:12px;padding:10px 12px 12px;font-family:Georgia,'Times New Roman',serif}.paper .mast{text-align:center;font-size:24px;font-weight:900;letter-spacing:.06em;border-bottom:3px double #2a2620;padding-bottom:4px;margin-bottom:6px}.paper .mast small{display:block;font-size:10px;letter-spacing:.02em;font-weight:400;opacity:.7}
.paper .pday{font:700 10px Inter,system-ui;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:8px 0 3px;border-top:1px solid rgba(0,0,0,.15);padding-top:6px}.paper .pn{display:flex;gap:8px;font-size:13px;line-height:1.3;margin:4px 0}.paper .pn i{font-style:normal}.paper .pn.big{font-size:17px;font-weight:700}
#story{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);width:min(380px,calc(100% - 28px));padding:18px 18px 16px;border-radius:22px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;background:rgba(22,30,27,.96);text-align:left}#story.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#story .sav{font-size:40px;line-height:1;margin-bottom:8px}#story small{opacity:.6;font-weight:800;letter-spacing:.06em;font-size:10px}#story b{display:block;font-size:19px;margin:4px 0 8px}#story p{margin:0 0 14px;font-size:14px;line-height:1.5;opacity:.9}#story .btn{width:100%;background:var(--acc);color:#1b1b12;font-weight:800}
#drv{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(380px,calc(100% - 24px));padding:10px 12px 12px;border-radius:20px;display:none;z-index:30;text-align:center}#drv.show{display:block}
#drv .dtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 8px}#drv .dtop b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#drv .dtop em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.75;font-size:13px;white-space:nowrap}
#drv .dbtns{display:grid;grid-template-columns:1fr .8fr .8fr 1fr;gap:8px}#drv .dbtns button{height:56px;border-radius:16px;border:0;background:rgba(255,255,255,.1);color:var(--txt);font-size:22px;font-weight:800;cursor:pointer;touch-action:manipulation}#drv .dbtns button.on{background:var(--acc);color:#1b211d}
@media (max-height:500px){#drv{padding:6px 10px 6px;width:min(460px,calc(100% - 24px));bottom:calc(8px + env(safe-area-inset-bottom))}#drv .dtop{margin-bottom:5px}#drv .dbtns button{height:42px;font-size:18px;border-radius:13px}#drv .dx{margin-top:2px!important;padding:3px!important}}
#drv .dx{margin-top:8px;width:100%;border:0;background:transparent;color:var(--txt);opacity:.7;font:inherit;font-size:13px;padding:6px;cursor:pointer}
.dchip{position:absolute;left:50%;top:-44px;transform:translateX(-50%);background:rgba(20,24,22,.82);color:#fff;padding:7px 14px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none}.dchip.pop{animation:dchip 3.2s ease forwards}@keyframes dchip{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
body.drive .top,body.drive .tools,body.drive .sub,body.drive .info,body.drive .legend,body.drive #obj,body.drive #retos,body.drive #req,body.drive #dec,body.drive #story,body.drive #chalp{display:none!important}
.tabs{display:flex;gap:4px;margin:-2px 0 10px;background:rgba(255,255,255,.06);border-radius:11px;padding:3px}.tabs button{flex:1;border:0;background:transparent;color:var(--txt);font:inherit;font-size:12px;font-weight:700;padding:7px 2px;border-radius:9px;cursor:pointer;opacity:.7}.tabs button.on{background:var(--acc);color:#1b211d;opacity:1}
.decs{display:flex;flex-direction:column;gap:6px}.dec{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:11px;padding:9px 11px;font:inherit;cursor:pointer}.dec b{display:flex;justify-content:space-between;gap:8px;font-size:13px}.dec b span{font-size:11px;opacity:.65;font-weight:700;white-space:nowrap}.dec small{display:block;font-size:11.5px;opacity:.75;margin-top:2px;line-height:1.3}.dec.on{border-color:var(--acc);background:rgba(242,200,75,.12)}.dec.lock{opacity:.45}
.req{pointer-events:auto;padding:9px 12px;font-size:12px;width:220px;display:none}.req.show{display:block}.req small{opacity:.6;font-weight:700;letter-spacing:.04em;font-size:10px}.rq{display:flex;gap:8px;align-items:flex-start;margin:4px 0 6px}.rq .av{font-size:22px;line-height:1}.rq b{display:block;font-size:12.5px}.rq span{opacity:.85;line-height:1.3}.req .rw{display:flex;justify-content:space-between;margin-top:5px;opacity:.75;font-variant-numeric:tabular-nums}.req .btnrow{margin-top:7px}.req .btn{padding:7px;font-size:12px}
.slot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}.slot img,.slot .ph{width:92px;height:58px;border-radius:9px;object-fit:cover;background:rgba(255,255,255,.07);flex:none;display:grid;place-items:center;font-size:11px;opacity:.9}
.slot .meta{flex:1;min-width:0;font-size:12px;line-height:1.35}.slot .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .meta span{opacity:.65}.slot .acts{display:flex;flex-direction:column;gap:4px}.slot .btn{padding:6px 9px;font-size:12px;flex:none}
.cname{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;font-weight:700;margin-bottom:6px}
#photo img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
body.shot #hud,body.shot #vig{display:none}
/* v0.20: estadísticas, logros, intendente, distritos, modo foto, partida nueva, tutorial y accesibilidad */
.chart{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chart div{background:rgba(255,255,255,.05);border-radius:10px;padding:7px 8px 4px}.chart b{display:block;font-size:11px;opacity:.7;font-weight:700}.chart em{font-style:normal;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.chart canvas{width:100%;height:46px;display:block}
.ach{display:flex;gap:9px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px}.ach i{font-style:normal;font-size:20px;width:28px;text-align:center;filter:grayscale(1);opacity:.35}.ach.on i{filter:none;opacity:1}.ach b{display:block;font-size:13px}.ach span{opacity:.65}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chips button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;cursor:pointer}.chips button.on{background:var(--acc);color:#1b1b12;border-color:var(--acc)}
.dist{padding:8px 0;border-bottom:1px solid var(--line)}.dist input{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.25);color:var(--txt);font:inherit;font-weight:800;font-size:14px;width:70%;padding:2px 0}.dist small{opacity:.6;font-size:11px;margin-left:6px}
.prom{display:block;width:100%;text-align:left;margin:5px 0;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;font-size:12.5px;padding:9px 11px;border-radius:10px;cursor:pointer}
#pm{position:absolute;left:50%;bottom:var(--sb);transform:translateX(-50%);width:min(420px,calc(100% - 20px));padding:10px 14px;display:none;pointer-events:auto}#pm.show{display:block}
#pm label{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;font-size:12px;font-weight:700;margin:4px 0}#pm input[type=range]{width:100%;accent-color:var(--acc)}
body.pmode .top,body.pmode .tools,body.pmode .sub,body.pmode .info,body.pmode .legend{display:none!important}
.coach{position:fixed;z-index:50;max-width:260px;padding:11px 13px;font-size:13px;line-height:1.35;pointer-events:auto}.coach .btnrow{margin-top:8px}.coach small{opacity:.6;font-weight:700;font-size:10.5px;letter-spacing:.05em}
.coachHi{position:fixed;z-index:49;border:2px solid var(--acc);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;transition:all .25s}
.sheet{max-height:calc(100% - var(--st) - 110px);overflow:auto}
#dlabs{position:absolute;inset:0;pointer-events:none;z-index:-1}
.dlab{position:absolute;pointer-events:none;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);transform:translate(-50%,-50%);white-space:nowrap}
body.tz1 .panel,body.tz1 .info,body.tz1 .sheet,body.tz1 .toast,body.tz1 .stats,body.tz1 .obj,body.tz1 .req,body.tz1 .tools,body.tz1 .sub{zoom:1.12}

body.calm .toast,body.calm .panel{transition:none}
#flash{position:fixed;inset:0;pointer-events:none;background:#eef3ff;opacity:0}
#nogl{display:none;position:fixed;inset:0;place-items:center;background:#16201c;color:#fff;text-align:center;padding:24px;font-size:15px;line-height:1.5}
@media (max-width:420px){.toast{top:calc(var(--st) + 258px)}.req{width:190px}.tools{left:8px;right:8px;transform:none;max-width:none;gap:1px;padding:5px}.tools .tool{flex:1 1 0;min-width:0;padding:6px 0 5px;font-size:9.5px;letter-spacing:-.01em}.tools .tool small{max-width:100%}.stats{min-width:0;padding:9px 10px}.money b{font-size:18px}.ib{width:38px;height:38px}.ctrl{max-width:128px}.tool{min-width:52px;padding:6px 6px 5px}.obj{width:190px}}
/* v0.25: contador de cuadros */
#fpsc{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(var(--sb) + 80px);font:700 11px/1.2 ui-monospace,monospace;color:#cfe;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:8px;pointer-events:none;display:none;white-space:pre}
/* v0.25: decisiones */
.dec{position:absolute;left:50%;bottom:calc(var(--sb) + 84px);transform:translate(-50%,12px);width:min(360px,calc(100% - 20px));padding:13px 15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
.dec{background:rgba(22,30,27,.95)}.dec.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}.dec small{opacity:.6;font-weight:800;letter-spacing:.05em;font-size:10px}.dec b{display:block;font-size:15px;margin:3px 0 4px}.dec p{margin:0 0 9px;font-size:12.5px;opacity:.85;line-height:1.4}
.dec .opt{display:flex;flex-direction:column;gap:6px}.dec .opt button{text-align:left;border:0;border-radius:11px;padding:8px 11px;font:inherit;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.09);color:var(--txt);cursor:pointer}
.dec .opt button:first-child{background:var(--acc);color:#1b211d}.dec .opt button i{display:block;font-style:normal;font-weight:550;font-size:11px;opacity:.75;margin-top:2px}
@media (max-height:500px) and (orientation:landscape){.dec{bottom:calc(var(--sb) + 56px);width:min(420px,calc(100% - 20px))}.dec .opt{flex-direction:row}.dec .opt button{flex:1}}
/* v0.25: por qué la gente no está contenta */
.why{display:none;font-size:11.5px;font-weight:700;color:#ffd59a;cursor:pointer;line-height:1.3}.why.show{display:block}.why u{text-decoration:none;opacity:.7}
/* v0.25: un solo botón de retos */
.retos{pointer-events:auto;border:0;color:var(--txt);font:inherit;font-size:13px;font-weight:750;padding:8px 13px;display:flex;align-items:center;gap:7px;cursor:pointer;align-self:flex-start;position:relative;transition:transform .12s}
.retos{justify-self:start}.retos:active{transform:scale(.95)}.retos .n{background:var(--acc);color:#1b211d;border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:850}.retos .ar{opacity:.65;font-size:11px;transition:transform .2s}
body.ro .retos .ar{transform:rotate(180deg)}.retos .nd{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px rgba(0,0,0,.35);animation:rpulse 1.6s infinite}
@keyframes rpulse{50%{transform:scale(1.35)}}
body:not(.ro) #obj,body:not(.ro) #req,body:not(.ro) #chalp{display:none!important}
.chalp{display:none}.chalp.show{display:block}.chalp .it+.it{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
/* v0.21: paneles plegables y celular horizontal */
.mini1{display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0}
.mini1 b{display:block!important;margin:0!important;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;font-size:12px!important}
.mini1 em{font-style:normal;opacity:.7;font-size:11px;font-variant-numeric:tabular-nums}.mini1 .av{font-size:15px}
.obj.mini,.req.mini{padding:7px 10px;cursor:pointer}.obj.mini .pg,.req.mini .pg{height:3px;margin-top:5px}
.clock{flex-wrap:wrap;row-gap:2px}.apv{opacity:.95;flex-basis:100%;padding-left:18px}
@media (max-height:500px) and (orientation:landscape){
 .left{display:grid;grid-template-columns:auto minmax(0,230px);grid-auto-rows:min-content;column-gap:8px;row-gap:6px;align-items:start}.left .stats{grid-row:span 5}
 .stats{padding:6px 10px;gap:3px;min-width:0}.stats .dem{display:none}.money b{font-size:16px}.row{gap:8px;font-size:12px}
 .left{flex:1 1 auto;min-width:0}.ctrl{flex:0 0 auto}.stats{flex:0 0 auto;width:236px}.stats .row{flex-wrap:nowrap;white-space:nowrap}.clock{white-space:nowrap}.stg{white-space:nowrap}
 .obj,.req{width:auto;min-width:0}
 .ctrl{max-width:none;flex-wrap:nowrap}.ib{width:36px;height:36px}
 .tools{padding:4px;gap:2px}.tools .tool{padding:4px 7px 3px;min-width:50px;font-size:10px}.tools .tool small{display:none}.tools .tool .i{width:17px;height:17px}.tool .dot{top:3px;right:5px}
 .sub{bottom:calc(var(--sb) + 52px)}.sub .tool{padding:4px 7px 3px;font-size:10px}
 .info{bottom:calc(var(--sb) + 52px);max-height:calc(100% - var(--st) - 70px)}
 .toast{top:auto;bottom:calc(var(--sb) + 56px)}

:root{--acc:#f5c945;--acc2:#e9b52a;--glass:rgba(18,25,23,.8);--line:rgba(255,255,255,.1);--spring:cubic-bezier(.2,1.25,.32,1);--ease:cubic-bezier(.25,.8,.25,1)}
html,body{font-family:'InterV',Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:'cv11','ss01','ss03';-webkit-font-smoothing:antialiased}
.glass{background:linear-gradient(180deg,rgba(36,46,42,.78),rgba(15,21,19,.86));-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.09);border-radius:18px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -10px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.16)}
.money b{font-size:21px;font-weight:800;letter-spacing:-.025em}.rate{font-weight:650;letter-spacing:-.01em}
.stats{padding:11px 13px;gap:7px}.row{font-weight:600;letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:14px;transition:transform .25s var(--spring),background .2s,opacity .2s}.ib:active{transform:scale(.88)}.ib svg.i{width:21px;height:21px}
.tools{padding:7px;gap:3px;border-radius:22px}
.tool{border-radius:15px;font-weight:600;letter-spacing:-.005em;transition:background .2s var(--ease),color .2s,transform .3s var(--spring),box-shadow .25s}.tool svg.i{width:22px;height:22px}
.tool.active{background:linear-gradient(180deg,#ffd964,var(--acc2));color:#1a1d14;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -4px rgba(245,201,69,.55)}
.tool:active{transform:scale(.9)}
.sub{border-radius:20px;transition:opacity .2s var(--ease),transform .35s var(--spring)}
.panel{border-radius:22px;padding:16px 18px;transition:opacity .22s var(--ease),transform .42s var(--spring)}
.panel.show{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px -12px rgba(0,0,0,.6),0 0 0 100vmax rgba(5,10,8,.28)}
.panel h3,.info h3{font-size:18px;font-weight:800;letter-spacing:-.025em}
.info{border-radius:20px;padding:14px 16px;transition:opacity .2s var(--ease),transform .38s var(--spring)}
.x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);opacity:.85;display:grid;place-items:center;padding:0;transition:background .2s,transform .25s var(--spring)}.x:active{transform:scale(.85)}.x svg.i{width:16px;height:16px}
.btn{min-height:42px;border-radius:13px;font-weight:700;letter-spacing:-.01em;background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .25s var(--spring),background .2s}.btn:active{transform:scale(.95)}
.btn[style*="var(--acc)"]{background:linear-gradient(180deg,#ffd964,var(--acc2))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -6px rgba(245,201,69,.6)}
.tabs{background:rgba(0,0,0,.22);border-radius:13px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}.tabs button{border-radius:10px;font-weight:650;transition:background .2s,color .2s,opacity .2s}.tabs button.on{background:linear-gradient(180deg,#ffd964,var(--acc2));box-shadow:0 2px 8px -2px rgba(0,0,0,.4)}
.ledger{gap:6px 12px}.ledger .h{font-size:10.5px;letter-spacing:.08em;opacity:.5;margin-top:10px}
.kv .m,.pg,.dem i{background:rgba(255,255,255,.1)}
.toast{border-radius:999px;padding:10px 18px;font-weight:600;letter-spacing:-.005em;transition:opacity .22s var(--ease),transform .4s var(--spring);transform:translate(-50%,-14px) scale(.96)}.toast.show{transform:translate(-50%,0) scale(1)}
.sheet{border-radius:20px;padding:7px}.sheet button{border-radius:12px;font-weight:550;transition:background .15s}.sheet button:active{background:rgba(255,255,255,.12)}
.chips button{transition:transform .25s var(--spring),background .2s}.chips button:active{transform:scale(.93)}.chips button.on{background:linear-gradient(180deg,#ffd964,var(--acc2))}
.obj,.req,.retos{border-radius:16px}
.banner h2{font-weight:900;letter-spacing:-.035em}
#story{border-radius:26px;background:linear-gradient(180deg,rgba(38,48,44,.97),rgba(16,22,20,.98));box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 100vmax rgba(5,10,8,.35);transition:opacity .3s var(--ease),transform .5s var(--spring)}
#drv .dbtns button{transition:transform .25s var(--spring),background .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}#drv .dbtns button:active{transform:scale(.9)}#drv .dbtns button.on{background:linear-gradient(180deg,#ffd964,var(--acc2))}
.panel::-webkit-scrollbar,.info::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-thumb,.info::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.glass,.tool,.panel,.info,.toast,.sub,.btn,#story{transition-duration:.01s!important}}
/* v0.32: el menú termina arriba de la barra de herramientas y se desplaza si no entra */
.sheet{max-height:calc(100% - var(--st) - var(--sb) - 196px);overscroll-behavior:contain}
body.tz1 .sheet{max-height:calc((100% - var(--st) - var(--sb) - 196px)/1.12)}body.tz2 .sheet{max-height:calc((100% - var(--st) - var(--sb) - 196px)/1.25)}
@media (max-height:500px) and (orientation:landscape){.sheet{top:calc(var(--st) + 64px);max-height:calc(100% - var(--st) - var(--sb) - 136px)}
 body.tz1 .sheet{max-height:calc((100% - var(--st) - var(--sb) - 136px)/1.12)}body.tz2 .sheet{max-height:calc((100% - var(--st) - var(--sb) - 136px)/1.25)}}
/* ===== v0.33: interfaz desplegable (la ciudad ocupa la pantalla) ===== */
svg.ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px;stroke-width:2}
.clock svg.sea{margin-left:2px}.clock .s0{color:#ffb3d1}.clock .s1{color:#ffd45e}.clock .s2{color:#f2a65a}.clock .s3{color:#bfe3ff}.apv svg.ic{color:#9cc8ee}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
svg.lk{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.ctrl{position:relative;flex-wrap:nowrap;max-width:none}
#bUndo{display:none}body.bopen #bUndo{display:grid}
.ctrlx{position:absolute;top:calc(100% + 6px);right:0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.ctrlx .ib{opacity:0;transform:translateY(-12px) scale(.7);transition:opacity .16s var(--ease),transform .38s var(--spring)}
body.cx .ctrlx{pointer-events:auto}body.cx .ctrlx .ib{opacity:1;transform:none}
body.cx .ctrlx .ib:nth-child(2){transition-delay:.03s}body.cx .ctrlx .ib:nth-child(3){transition-delay:.06s}body.cx .ctrlx .ib:nth-child(4){transition-delay:.09s}
#bMore svg{transition:transform .35s var(--spring)}body.cx #bMore{color:var(--acc)}body.cx #bMore svg{transform:rotate(90deg)}
body.lefty .ctrlx{right:auto;left:0}
/* pastilla de info: compacta, se despliega con la flechita */
.stats{position:relative;padding-right:36px}
.sx{position:absolute;top:5px;right:3px;width:32px;height:32px;border:0;background:transparent;color:var(--txt);opacity:.65;display:grid;place-items:center;border-radius:10px;cursor:pointer;pointer-events:auto}
.sx svg{width:17px;height:17px;transition:transform .35s var(--spring)}body.sfull .sx svg{transform:rotate(180deg)}.sx:active{background:rgba(255,255,255,.1)}
.mini{display:none}
body:not(.sfull) .stats{min-width:0;width:auto;padding:8px 36px 8px 12px;gap:4px}
body:not(.sfull) .stats .money{gap:6px;white-space:nowrap}body:not(.sfull) .stats .money b{font-size:17px}body:not(.sfull) .stats .rate{font-size:11px}
body:not(.sfull) .stats .row,body:not(.sfull) .stats .dem,body:not(.sfull) .stats .stg,body:not(.sfull) .stats .clock,body:not(.sfull) .stats .why{display:none}
body:not(.sfull) .stats .mini{display:flex;gap:11px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini span{display:flex;gap:4px;align-items:center}.mini svg.i{width:14px;height:14px;opacity:.7}
.stats.warn{box-shadow:0 0 0 1.5px rgba(255,122,107,.8),0 8px 22px -6px rgba(255,90,70,.45)}
/* retos: solo el ícono con el número */
.retos{width:44px;height:44px;padding:0;justify-content:center;align-self:start;border-radius:15px}.retos .rl,.retos .ar{display:none}.retos svg.ic{margin:0;width:21px;height:21px;color:#ff8a7a}
.retos .n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;box-shadow:0 0 0 2px rgba(18,25,23,.9)}
.retos .nd{top:auto;bottom:-3px;right:-3px}
body.ro .retos{background:rgba(255,138,122,.18)}
body.bopen .left .retos{display:none}
body.sfull .stats{min-width:226px}body.sfull .left .retos{grid-column:1;grid-row:2}
.left{min-width:0;display:grid;grid-template-columns:auto auto;justify-content:start;align-items:start;column-gap:8px;row-gap:8px}
.left .stats{grid-column:1;grid-row:1}.left .retos{grid-column:2;grid-row:1}.left .obj,.left .req,.left .chalp{grid-column:1/-1}
/* botón Construir: la barra de herramientas aparece al tocarlo */
.fab{position:absolute;left:50%;bottom:var(--sb);translate:-50% 0;height:54px;padding:0 22px 0 17px;border-radius:27px;border:0;display:flex;align-items:center;gap:9px;font:inherit;font-weight:750;font-size:15px;letter-spacing:-.01em;color:#1a1d14;
 background:linear-gradient(180deg,#ffd964,var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -6px rgba(245,201,69,.6),0 2px 8px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;transition:opacity .2s var(--ease),transform .38s var(--spring)}
.fab svg.i{width:23px;height:23px;stroke-width:2.1}.fab:active{transform:scale(.92)}
body.bopen .fab{opacity:0;pointer-events:none;transform:scale(.5) translateY(20px)}
.tools{transition:opacity .2s var(--ease),translate .4s var(--spring)}
body:not(.bopen) .tools{opacity:0;pointer-events:none;translate:0 34px}
body:not(.bopen) .sub{display:none}
.tool.tclose{flex:0 0 46px!important;min-width:46px;color:#aab8b0}.tool.tclose svg.i{transition:transform .3s var(--spring)}
body.drive .fab,body.pmode .fab{display:none!important}
/* avisos: chiquitos, arriba al centro, sin tapar la ciudad */
.toast{top:calc(var(--st) + 66px)!important;bottom:auto!important;font-size:12.5px;padding:8px 15px;max-width:min(340px,calc(100% - 24px))}
body.sfull .toast{top:calc(var(--st) + 200px)!important}
/* menú: Avanzado plegable */
.sheet .adv-t svg.i{width:16px;height:16px;opacity:.6;transition:transform .3s var(--spring)}.sheet .adv-t.on svg.i{transform:rotate(180deg)}
.adv{display:none;flex-direction:column;margin:0 0 0 8px;border-left:1px solid var(--line);padding-left:4px}.adv.show{display:flex}
@media (max-height:500px) and (orientation:landscape){
 .left{grid-template-columns:auto minmax(0,230px)}.left .stats{grid-row:span 5}.left .obj,.left .req,.left .chalp{grid-column:2}
 body:not(.sfull) .stats{width:auto}
 .fab{height:44px;font-size:14px;padding:0 18px 0 14px}
 .toast{top:calc(var(--st) + 6px)!important}body.sfull .toast{top:calc(var(--st) + 6px)!important}
}

/* v0.33: intro de cine */
#intro{position:fixed;inset:0;z-index:90;display:none;pointer-events:auto;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(8,6,12,.55) 100%)}
#intro.on{display:block}
#intro .ibar{position:absolute;left:0;right:0;top:0;height:11vh;background:#05050a;transform:translateY(-100%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#intro .ibar.b{top:auto;bottom:0;transform:translateY(100%)}
#intro.show .ibar{transform:none}
#intro .ilogo{position:absolute;left:0;right:0;top:38%;text-align:center;opacity:0;transform:translateY(14px) scale(.98);transition:opacity 1.4s ease,transform 2.4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#intro.show .ilogo{opacity:1;transform:none}
#intro .ilogo b{display:block;font:800 clamp(46px,14vw,104px)/1 InterV,system-ui,sans-serif;letter-spacing:.2em;padding-left:.2em;color:#fff7e6;
 background:linear-gradient(180deg,#fffaf0 20%,#ffd98a 62%,#f2a33c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 22px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,190,110,.35))}
#intro .ilogo span{display:block;margin:14px auto 0;max-width:92vw;font:500 clamp(11px,3.1vw,17px)/1.3 InterV,system-ui,sans-serif;letter-spacing:.2em;white-space:nowrap;text-transform:uppercase;color:rgba(255,244,226,.9);text-shadow:0 2px 12px rgba(0,0,0,.7)}
#intro .iskip{position:absolute;left:0;right:0;bottom:calc(11vh + 18px);text-align:center;font:600 12px InterV,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6);opacity:0;transition:opacity 1s 1.6s}
#intro.show .iskip{opacity:1}
#intro.fade .ilogo,#intro.fade .iskip{opacity:0!important;transition:opacity .7s}
#intro.fade .ibar{transform:translateY(-100%)!important}#intro.fade .ibar.b{transform:translateY(100%)!important}
#intro.fade{background:transparent;transition:background .8s}

#hud{transition:opacity .8s}

<script>
'use strict';
/* =====================================================================
   URBANA v0.33 — motor WebGL2 propio
   · v0.33: intro de cine, edificios que se construyen con andamio y grúa, interfaz desplegable, íconos propios, sombras guardadas
     (y 30 cuadros con la cámara quieta), noche con faros y brillo de ciudad, cámara dron, calles diagonales y curvas que los autos siguen,
     colectivos pintados, cafés en la vereda, asado los domingos y festejos de la Selección
   · v0.32: luz más liviana en media/ahorro, la resolución baja con los efectos, menú que entra en apaisado, contador oculto con el menú, más luz con lluvia
   · v0.31: luz realista (lineal, especular GGX, tonemap ACES), relieve en fachadas, autos modelados, interfaz premium con Inter, simulación repartida entre cuadros
   · v0.30 (0.26 a 0.30 juntas): arreglo del parpadeo (textura del relieve en su propia unidad), copias automáticas, consejeros, maravillas por etapas,
     ciclistas, clases sociales, producción y comercio con vecinos, diario, modo paseo, carnaval y año nuevo, modo historia y 3 escenarios nuevos
   · v0.25: sin parpadeo al hacer zoom, botón de retos, diagnóstico de felicidad, decisiones del intendente, vida en la calle, noche, agua, clima, paisaje infinito, sonido por zona, música por etapa
   · v0.21: suelo con detalle, 7 árboles, oclusión ambiental, casas y edificios porteños, peatones animados, atardecer, interfaz para celular, arranque más amable
   · v0.20: estaciones, delito, salud, educación, basura, turismo, comercio exterior,
     tranvía, tren elevado, ferry, bicisendas, distritos, elecciones, logros, modos y mapas
   · Posproceso: MSAA, bloom, gradación de color, efecto maqueta
   · Nubes con sombra, viento en árboles, reflejos, agua, AO de contacto
   · 10 etapas y ~50 edificios desbloqueables (datos en DEF)
   · Malla estática por chunk (16×16) reconstruida solo si cambia algo
   · Sombras con shadow map + PCF por hardware, ciclo día/noche
   · Autos y peatones instanciados (1 draw call cada uno)
   · Simulación: zonas R/C/I que crecen solas, servicios con radio,
     valor del suelo, contaminación, incendios, presupuesto e hitos
   ===================================================================== */
const $=id=>document.getElementById(id);
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
const prefs={sound:true,music:true,amb:true,quality:IS_TOUCH?'media':'alta',grid:'build',daynight:true,disasters:true,tilt:true};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('urbana_prefs')||'{}'))}catch(e){}
if(!['alta','media','ahorro'].includes(prefs.quality))prefs.quality='media';
if(prefs.pv!==20){prefs.pv=20;prefs.quality=IS_TOUCH?'media':'alta';try{localStorage.setItem('urbana_prefs',JSON.stringify(prefs))}catch(e){}}
// calidad efectiva: la elegida en el menú, bajada solo por esta sesión si el equipo no da (no se guarda)
const QL=['alta','media','ahorro'];let qDown=0,RS=1;const Q=()=>QL[Math.min(2,QL.indexOf(prefs.quality)+qDown)];
function savePrefs(){try{localStorage.setItem('urbana_prefs',JSON.stringify(prefs))}catch(e){}}

// ---------------------------------------------------------------- utilidades
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fmt=n=>Math.round(n).toLocaleString('es-AR');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const _CC=new Map();const C=h=>{let c=_CC.get(h);if(!c){c=[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];_CC.set(h,c)}return c};
const mul=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const mul3=(a,b)=>[a[0]*b[0],a[1]*b[1],a[2]*b[2]];
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
function hash2(x,y){let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v)}

// ---------------------------------------------------------------- mundo
const N=128,NN=N*N,CH=8,NC=N/CH,D4=[[1,0],[-1,0],[0,1],[0,-1]];
const EMPTY=0,ROAD=1,ZR=2,ZC=3,PARK=4,TREE=5,ZI=6,POLICE=7,FIRE=8,HEALTH=9,SCHOOL=10,PLAZA=11,OBELISK=12;
// v0.18: caminos y edificios especiales (todos definidos por datos en DEF)
const DIRT=13,AVE=14,HWY=15,FARM=16,STORE=17,KIOSK=18,SOCCER=19,BUS=20,CHAPEL=21,SUPER=22,WORKSHOP=23,PLANT=24,CLUB=25,FOUNTAIN=26,BANK=27,GAS=28,WTANK=29,LIBRARY=30,
 HIGHSCH=31,CINEMA=32,MALL=33,DEPOT=34,WTREAT=35,UNI=36,STADIUM=37,TERMINAL=38,THERMAL=39,MUSEUM=40,SUBWAY=41,OFFICE=42,AIRFIELD=43,SOLAR=44,PLANET=45,
 THEATER=46,PORT=47,CONV=48,ZOO=49,AIRPORT=50,BULLET=51,MIRADOR=52,ARCH=53,LEGEND=54,BOTANIC=55,PUMP=56,LEVEE=57;
// v0.20: zona mixta, barrio cerrado, turismo, basura, transporte nuevo, rotonda y monumentos
const ZM=58,BCERR=59,HOTEL=60,BEACH=61,PARKING=62,LANDFILL=63,RECYCLE=64,INCINER=65,FERRY=66,TRAINST=67,ROUNDI=68,CABILDO=69,FARO=70,CLOCK=71,CATHED=72,WHEEL=73,GOVH=74,CLINIC=75,W_TORRE=76,W_PARQUE=77,W_ESTADIO=78,W_PALACIO=79,NT=80;
const isZone=t=>t===ZR||t===ZC||t===ZI||t===ZM,isRoadT=t=>t===ROAD||t===DIRT||t===AVE||t===HWY||t===ROUNDI;
const occ2=new Uint16Array(NN);// empleos de la zona mixta (occ = vecinos)
const type=new Uint8Array(NN),level=new Uint8Array(NN),occ=new Uint16Array(NN),variant=new Uint8Array(NN),burn=new Uint8Array(NN),part=new Uint8Array(NN);
const born=new Float64Array(NN),happy=new Float32Array(NN);
// v0.19 terreno: 0 tierra · 1 agua · 2 loma (hgt = altura) · wire: bit1 cable eléctrico, bit2 caño de agua · flood: inundación

const WHY={util:['Faltan luz o agua','Poné una usina y una bomba de agua, y llevalas con calles, cables y caños hasta las casas.'],poll:['Contaminación cerca de las casas','Alejá la industria de las viviendas y poné árboles o parques en el medio.'],
 jobs:['Falta trabajo','Zonificá comercio o industria cerca de las casas.'],traf:['Mucho tránsito','Poné avenidas, rotondas o líneas de colectivo y subte.'],crime:['Inseguridad','Construí una comisaría cerca: baja el delito y sube la felicidad.'],
 health:['No hay salud cerca','Una salita o un hospital cerca de las casas sube mucho la felicidad.'],edu:['Faltan escuelas','Poné una escuela: además sube el nivel de educación.'],park:['Faltan plazas','Plazas y parques cerca de las casas suben la felicidad y bajan el delito.'],
 tax:['Impuestos altos','Bajá el impuesto residencial en el presupuesto.'],garb:['Basura en las veredas','Poné un relleno o una planta de reciclaje y que llegue el camión.'],shop:['Faltan negocios cerca','Zonificá comercio a pocas cuadras de las casas.']};
let whyList=[],whyTxt='';
function diagnose(){const s={},at={},w={};for(const k in WHY){s[k]=0;w[k]=0;at[k]=-1}let tot=0;
 const add=(k,v,i,wt)=>{if(v<=0)return;s[k]+=v*wt;if(v*wt>w[k]){w[k]=v*wt;at[k]=i}};
 for(let i=0;i<NN;i++){const tt=type[i];if((tt!==ZR&&tt!==ZM)||!level[i])continue;const wt=Math.max(1,occ[i]);tot+=wt;
  add('util',utilPen(i),i,wt);add('poll',poll[i]*.35,i,wt);add('traf',trafPen(i),i,wt);add('crime',crime[i]*.12+.08*(1-Math.min(1,covP[i])),i,wt);add('health',covH[i]>0?0:.1,i,wt);
  add('edu',.07*(1-Math.min(1,covS[i])),i,wt);add('park',Math.max(0,.12-parkI[i]*.08),i,wt);add('garb',garbP[i]>=40?.07:0,i,wt);add('shop',comInf[i]?0:.1,i,wt)}
 if(!tot){whyList=[];return}for(const k in s)s[k]/=tot;s.jobs=unemp*.3;s.tax=Math.max(0,(taxes.r-9)*.015);
 whyList=Object.keys(s).filter(k=>s[k]>.025).sort((a,b)=>s[b]-s[a]).slice(0,3).map(k=>({k,v:s[k],at:at[k]}))}
function renderWhy(){const el=$('why');const show=pop>=20&&hap<.62&&whyList.length;const t=show?whyList.map(o=>o.k).join(','):'';if(t===whyTxt)return;whyTxt=t;
 el.classList.toggle('show',!!show);if(show)el.innerHTML=ic('sad')+'Lo que más molesta: '+WHY[whyList[0].k][0]+(whyList[1]?' <u>· '+WHY[whyList[1].k][0]+'</u>':'')+' ›'}
$('why').onclick=e=>{e.stopPropagation();const o=whyList[0];if(!o)return;if(o.at>=0)focusCell(o.at);toast('💡 '+WHY[o.k][0]+': '+WHY[o.k][1]+(whyList[1]?' También: '+WHY[whyList[1].k][0].toLowerCase()+'.':''),6500);SFX.ui()};
