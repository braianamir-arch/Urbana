name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Armar el APK
        run: ./android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: urbana-apk
          path: android/out/urbana.apk
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk android/out/urbana.apk --title "URBANA para Android" --notes "Bajá urbana.apk e instalalo en el celular. Trae el juego completo y anda sin internet."

  prueba:
    # instala el APK en un Android de prueba, lo abre y guarda una captura
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: urbana-apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install urbana.apk
            adb logcat -c
            adb shell am start -n app.urbana.juego/.MainActivity
            sleep 45
            adb exec-out screencap -p > captura1.png
            S=$(adb shell wm size | tr -dc '0-9x'); W=${S%x*}; H=${S#*x}; echo "pantalla $W x $H"; adb shell input tap $((W/2)) $((H*455/1000))
            sleep 30
            adb exec-out screencap -p > captura2.png
            adb logcat -d > logcat.txt
            adb shell pidof app.urbana.juego > pid.txt || echo "LA APP NO ESTA CORRIENDO" > pid.txt
            grep -c "URBANA-JS" logcat.txt || true
            grep "URBANA-JS\|FATAL EXCEPTION\|AndroidRuntime" logcat.txt | head -60 > resumen.txt || true
            cat pid.txt resumen.txt
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload apk captura1.png captura2.png resumen.txt pid.txt --clobber
